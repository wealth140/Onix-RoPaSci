<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Play a quick game of rock, paper, scissors against the computer.">
  <title>Onix-RoPaSci</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111827;
      color: #f8fafc;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --muted: #a7b3c5;
      --accent: #73e0b0;
      --surface: #1b2638;
      --border: #34445a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 0;
      min-height: 100vh;
      margin: 0;
      padding: clamp(16px, 5vw, 48px) clamp(10px, 4vw, 20px);
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at 50% 0, rgb(41 70 87 / 40%), transparent 55%),
        #111827;
    }

    button {
      color: inherit;
      font: inherit;
    }

    .game {
      width: min(100%, 600px);
      min-width: 0;
      padding: clamp(18px, 5vw, 48px);
      border: 1px solid var(--border);
      border-radius: 24px;
      background: rgb(27 38 56 / 94%);
      box-shadow: 0 24px 80px rgb(0 0 0 / 28%);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 750;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 8vw, 3rem);
      letter-spacing: -0.05em;
      overflow-wrap: anywhere;
    }

    .intro {
      margin: 12px 0 30px;
      color: var(--muted);
      line-height: 1.6;
    }

    .moves {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .move-button {
      min-width: 0;
      min-height: 122px;
      padding: 16px 8px;
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 8px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #141e2e;
      cursor: pointer;
      transition: border-color 160ms ease, background-color 160ms ease, transform 160ms ease;
    }

    .move-button:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      background: #1e3040;
    }

    .move-button:focus-visible,
    .control-button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    .move-button img {
      width: 52px;
      height: 52px;
      object-fit: contain;
    }

    .move-name {
      font-size: clamp(0.78rem, 3.5vw, 0.95rem);
      font-weight: 700;
    }

    .result {
      min-height: 30px;
      margin: 28px 0 6px;
      color: var(--accent);
      font-size: 1.25rem;
      font-weight: 750;
    }

    .round-display {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: clamp(8px, 2vw, 16px);
      margin: 0 0 26px;
    }

    .round-card {
      min-width: 0;
      min-height: 142px;
      padding: 14px 8px;
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 8px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #141e2e;
    }

    .round-label {
      font-size: 0.9rem;
      font-weight: 700;
    }

    .round-move-image {
      display: block;
      width: clamp(52px, 18vw, 96px);
      aspect-ratio: 1;
      object-fit: contain;
    }

    .round-move-image[hidden],
    .round-placeholder[hidden] {
      display: none;
    }

    .round-placeholder {
      color: var(--muted);
      font-size: 0.75rem;
      line-height: 1.4;
    }

    .versus {
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 750;
    }

    .scoreboard {
      padding: 20px 12px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #141e2e;
    }

    .score-item {
      display: grid;
      gap: 5px;
    }

    .score-value {
      font-size: 1.6rem;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
    }

    .score-label {
      color: var(--muted);
      font-size: 0.78rem;
    }

    .controls {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .control-button {
      min-height: 44px;
      padding: 10px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #26354a;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 700;
      transition: background-color 160ms ease, border-color 160ms ease;
    }

    .control-button:hover {
      border-color: #718198;
      background: #30425a;
    }

    .auto-play[aria-pressed="true"] {
      border-color: var(--accent);
      color: var(--accent);
    }

    .hint {
      margin: 22px 0 0;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.8;
    }

    kbd {
      padding: 2px 6px;
      border: 1px solid #536278;
      border-radius: 5px;
      color: #e2e8f0;
      font: inherit;
      font-size: 0.75rem;
    }

    @media (max-width: 420px) {
      .game {
        padding: clamp(16px, 5vw, 24px);
      }

      .moves {
        gap: clamp(6px, 2vw, 8px);
      }

      .move-button {
        min-height: 100px;
        padding: 12px 4px;
      }

      .move-button img {
        width: clamp(38px, 13vw, 48px);
        height: auto;
        aspect-ratio: 1;
      }

      .round-display {
        gap: 6px;
      }

      .round-card {
        min-height: 128px;
        padding: 10px 4px;
      }

      .scoreboard {
        padding: 16px 6px;
      }

      .controls {
        gap: 8px;
      }

      .control-button {
        flex: 1 1 120px;
        padding-inline: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="game">
    <p class="eyebrow">Quick match</p>
    <h1>Onix-RoPaSci</h1>
    <p class="intro">Choose your move and see if you can beat the computer.</p>

    <section class="moves" aria-label="Choose your move">
      <button class="move-button" type="button" data-move="rock" aria-label="Choose rock">
        <img src="pictures/rock-emoji.png" alt="">
        <span class="move-name">Rock</span>
      </button>
      <button class="move-button" type="button" data-move="paper" aria-label="Choose paper">
        <img src="pictures/paper-emoji.png" alt="">
        <span class="move-name">Paper</span>
      </button>
      <button class="move-button" type="button" data-move="scissors" aria-label="Choose scissors">
        <img src="pictures/scissors-emoji.png" alt="">
        <span class="move-name">Scissors</span>
      </button>
    </section>

    <p class="result" aria-live="polite">Make your first move</p>
    <section class="round-display" aria-label="Moves in this round">
      <div class="round-card">
        <span class="round-label">You</span>
        <img class="round-move-image" data-round-image="player" alt="" hidden>
        <span class="round-placeholder" data-round-placeholder="player">Choose a move</span>
      </div>
      <span class="versus" aria-hidden="true">VS</span>
      <div class="round-card">
        <span class="round-label">Computer</span>
        <img class="round-move-image" data-round-image="computer" alt="" hidden>
        <span class="round-placeholder" data-round-placeholder="computer">Waiting</span>
      </div>
    </section>

    <section class="scoreboard" aria-label="Score">
      <div class="score-item">
        <span class="score-value" data-score="wins">0</span>
        <span class="score-label">Wins</span>
      </div>
      <div class="score-item">
        <span class="score-value" data-score="losses">0</span>
        <span class="score-label">Losses</span>
      </div>
      <div class="score-item">
        <span class="score-value" data-score="ties">0</span>
        <span class="score-label">Ties</span>
      </div>
    </section>

    <div class="controls">
      <button class="control-button auto-play" type="button" aria-pressed="false">Auto play</button>
      <button class="control-button reset" type="button">Reset score</button>
    </div>

    <p class="hint">Keyboard: <kbd>R</kbd> rock · <kbd>P</kbd> paper · <kbd>S</kbd> scissors · <kbd>Backspace</kbd> reset</p>
  </main>

  <script>
    const scoreStorageKey = 'score';
    const moves = ['rock', 'paper', 'scissors'];
    const score = loadScore();
    const resultElement = document.querySelector('.result');
    const playerMoveImage = document.querySelector('[data-round-image="player"]');
    const computerMoveImage = document.querySelector('[data-round-image="computer"]');
    const autoPlayButton = document.querySelector('.auto-play');
    let isAutoPlaying = false;
    let autoPlayInterval;

    renderScore();

    document.querySelectorAll('.move-button').forEach((button) => {
      button.addEventListener('click', () => playRound(button.dataset.move));
    });

    document.querySelector('.reset').addEventListener('click', resetScore);

    autoPlayButton.addEventListener('click', () => {
      if (isAutoPlaying) {
        stopAutoPlay();
        return;
      }

      isAutoPlaying = true;
      autoPlayButton.textContent = 'Stop auto play';
      autoPlayButton.setAttribute('aria-pressed', 'true');
      autoPlayInterval = window.setInterval(() => {
        playRound(pickComputerMove());
      }, 1000);
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Backspace') {
        event.preventDefault();
        resetScore();
        return;
      }

      const move = { r: 'rock', p: 'paper', s: 'scissors' }[event.key.toLowerCase()];
      if (move) {
        playRound(move);
      }
    });

    function loadScore() {
      try {
        const savedScore = JSON.parse(localStorage.getItem(scoreStorageKey));
        if (savedScore && ['wins', 'losses', 'ties'].every((key) =>
          Number.isSafeInteger(savedScore[key]) && savedScore[key] >= 0
        )) {
          return savedScore;
        }
      } catch (error) {
        console.warn('Unable to load the saved score.', error);
      }

      return { wins: 0, losses: 0, ties: 0 };
    }

    function playRound(playerMove) {
      const computerMove = pickComputerMove();
      const outcome = playerMove === computerMove
        ? 'ties'
        : (moves[(moves.indexOf(playerMove) + 1) % moves.length] === computerMove ? 'losses' : 'wins');

      score[outcome] += 1;
      resultElement.textContent = outcome === 'ties'
        ? "It's a tie!"
        : outcome === 'wins' ? 'You win!' : 'You lose!';
      showMoveImage(playerMoveImage, playerMove);
      showMoveImage(computerMoveImage, computerMove);
      saveScore();
      renderScore();
    }

    function showMoveImage(image, move) {
      image.src = `pictures/${move}-emoji.png`;
      image.alt = capitalize(move);
      image.hidden = false;
      document.querySelector(`[data-round-placeholder="${image.dataset.roundImage}"]`).hidden = true;
    }

    function pickComputerMove() {
      return moves[Math.floor(Math.random() * moves.length)];
    }

    function resetScore() {
      score.wins = 0;
      score.losses = 0;
      score.ties = 0;
      try {
        localStorage.removeItem(scoreStorageKey);
      } catch (error) {
        console.warn('Unable to clear the saved score.', error);
      }
      renderScore();
    }

    function saveScore() {
      try {
        localStorage.setItem(scoreStorageKey, JSON.stringify(score));
      } catch (error) {
        console.warn('Unable to save the score.', error);
      }
    }

    function renderScore() {
      Object.entries(score).forEach(([key, value]) => {
        document.querySelector(`[data-score="${key}"]`).textContent = value;
      });
    }

    function stopAutoPlay() {
      window.clearInterval(autoPlayInterval);
      isAutoPlaying = false;
      autoPlayButton.textContent = 'Auto play';
      autoPlayButton.setAttribute('aria-pressed', 'false');
    }

    function capitalize(word) {
      return word[0].toUpperCase() + word.slice(1);
    }
  </script>
</body>
</html>
